name: Merge Defconfig

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  merge-and-upload-config:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4

      - name: Setup Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses-dev bison flex libssl-dev libelf-dev bc ccache

 
     
      - name: Merge Configs Using Make
        run: |
          # Pass base defconfig followed by all vendor fragments in sequence
          make ARCH=arm64 \
            vendor/lahaina-qgki_defconfig \
            vendor/debugfs.config \
            vendor/xiaomi_QGKI.config \
            vendor/vili_QGKI.config \
            vendor/change.config \
            

          # Save minimalized, clean merged defconfig file
          make ARCH=arm64 savedefconfig

          # Copy generated defconfig to workspace root for artifact upload
          cp defconfig merged_vili_defconfig

      - name: Upload Merged Defconfig Artifact
        uses: actions/upload-artifact@v4
        with:
          name: merged-vili-defconfig
          path: |
            merged_vili_defconfig
            .config
          retention-days: 7
