name: Build Kernel with KSU-Next and SUSFS

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      CLANG_URL: "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r547379.tar.gz"
      CLANG_DIR: "clang-r547379"

    steps:
      - name: Checkout Kernel Repository
        uses: actions/checkout@v4
        with:
          ref: lineage-23.2
          fetch-depth: 0
          fetch-tags: true

      - name: Clone AnyKernel3
        run: |
          git clone --depth=1 -b lord-ak-old https://github.com/moha998844/AnyKernel3.git "$GITHUB_WORKSPACE/AnyKernel3"

      - name: Setup KernelSU-Next & SUSFS
        run: |
          cd "$GITHUB_WORKSPACE"

          # KernelSU-Next, legacy branch
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s legacy

          # SUSFS patches, kernel-5.4 branch
          git clone --depth=1 --branch kernel-5.4 https://gitlab.com/simonpunk/susfs4ksu.git susfs4ksu

          # Copie sécurisée des correctifs en fonction de l'arborescence officielle de susfs4ksu
          cp susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch KernelSU-Next/
          cp susfs4ksu/kernel_patches/50_add_susfs_in_kernel-5.4.patch .
          cp -r susfs4ksu/kernel_patches/fs/* fs/
          cp -r susfs4ksu/kernel_patches/include/linux/* include/linux/

          # Application des patchs dans les bons répertoires
          cd KernelSU-Next
          patch -p1 < 10_enable_susfs_for_ksu.patch
          cd ..
          patch -p1 < 50_add_susfs_in_kernel-5.4.patch

          # Nettoyage
          rm -rf susfs4ksu 10_enable_susfs_for_ksu.patch 50_add_susfs_in_kernel-5.4.patch 2>/dev/null || true

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y lld llvm build-essential bc bison flex libncurses5-dev libssl-dev python3 python3-pip zip patch device-tree-compiler

      - name: Cache Clang Toolchain
        id: cache-clang
        uses: actions/cache@v4
        with:
          path: \({{ github.workspace }}/\){{ env.CLANG_DIR }}
          key: \({{ runner.os }}-clang-\){{ env.CLANG_URL }}

      - name: Download and Extract Clang
        if: steps.cache-clang.outputs.cache-hit != 'true'
        run: |
          mkdir -p "\(GITHUB_WORKSPACE/\)CLANG_DIR"
          wget -qO clang.tar.gz "$CLANG_URL"
          tar -xzf clang.tar.gz -C "\(GITHUB_WORKSPACE/\)CLANG_DIR"
          rm clang.tar.gz

      - name: Set Clang Path
        run: |
          echo "\(GITHUB_WORKSPACE/clang-r547379/bin" >>\)GITHUB_PATH

      - name: Check Toolchain
        run: |
          ld.lld --version
          clang --version

      - name: Determine Release Tag
        id: tag
        run: |
          GIT_TAG=$(git describe --tags --exact-match 2>/dev/null || true)

          if [ -n "$GIT_TAG" ]; then
            echo "RELEASE_TAG=\(GIT_TAG" >>\)GITHUB_ENV
            echo "IS_PRERELEASE=false" >> $GITHUB_ENV
          else
            SHORT_HASH=$(git rev-parse --short=7 HEAD)
            echo "RELEASE_TAG=\(SHORT_HASH" >>\)GITHUB_ENV
            echo "IS_PRERELEASE=true" >> $GITHUB_ENV
          fi

      - name: Build AnyKernel3
        run: |
          cd "$GITHUB_WORKSPACE/AnyKernel3"
          export KROOT="$GITHUB_WORKSPACE"
          export ZIPPREFIX="${{ env.RELEASE_TAG }}"
          export BUILD="1"
          export ANYKERNEL="1"
          bash ./sus.sh

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Release ${{ env.RELEASE_TAG }}
          body: |
            Automated AnyKernel3 build for Xiaomi 11T Pro (vili) with KernelSU-Next & SUSFS.
            Commit: ${{ github.sha }}
          draft: false
          prerelease: ${{ env.IS_PRERELEASE }}
          files: |
            ${{ github.workspace }}/AnyKernel3/*.zip
